<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<!-- AJOUT : sans cette balise, Safari iOS rend la page en ~980px et les @media ne se déclenchent pas.
     Doc : https://developer.mozilla.org/en-US/docs/Web/HTML/Viewport_meta_tag -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LadyBug</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="192x192" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<style>
  /* ─── BASE ─── */
  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    height: 100vh;   /* fallback navigateurs anciens */
    height: 100dvh;  /* MODIF : évite le débordement sous la barre d'adresse mobile
                        https://developer.mozilla.org/en-US/docs/Web/CSS/length#dynamic */
    margin: 0;
    background: linear-gradient(135deg, #ffe6f0, #fff0f5);
    font-family: 'Poppins', sans-serif;
    color: #ff3366;
    text-align: center;
    position: relative;
  }
  h1 { font-size: 2.5em; margin-bottom: 30px; }

  /* ─── COMPTEUR ─── */
  #timer {
    display: flex;
    gap: 15px;
    font-size: 2.5em;
    font-weight: bold;
    flex-wrap: wrap;
    justify-content: center;
    animation: fadeIn 1s ease-in-out;
  }
  .time-block {
    background: rgba(255, 255, 255, 0.3);
    padding: 15px 25px;
    border-radius: 15px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.1);
    transition: transform 0.3s;
  }
  .time-block:hover { transform: scale(1.05); }

  /* ─── BADGE "DEPUIS" ─── */
  #since { position: absolute; top: 15px; left: 15px; font-size: 1.2em; padding: 8px 15px; }

  /* ─── CHAT ─── */
  #chat {
    position: absolute;
    top: 15px;
    right: 15px;
    width: 220px;
    height: 250px;
    background: rgba(255,255,255,0.3);
    border-radius: 15px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
    padding: 10px;
    gap: 10px;
    overflow: hidden;
  }

  /* flex:1 + min-height:0 → c'est CETTE zone qui scrolle, pas #chat.
     Piège : sans min-height:0, un enfant flex refuse de rétrécir et déborde.
     Doc : https://developer.mozilla.org/en-US/docs/Web/CSS/min-height */
  #messages {
    display: flex;
    flex-direction: column;
    gap: 5px;
    width: 100%;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
  }

  /* Classes plutôt que styles inline en JS : thème modifiable ici seulement. */
  #messages .msg {
    max-width: 80%;
    padding: 5px 10px;
    border-radius: 10px;
    word-break: break-word;
    background: rgba(255,255,255,0.3);
  }
  /* align-self marche car #messages est un flex en colonne.
     https://developer.mozilla.org/en-US/docs/Web/CSS/align-self */
  .msg--pink { color: #ff3366; align-self: flex-end;   } /* droite */
  .msg--blue { color: #a0c4ff; align-self: flex-start; } /* gauche */

  #chat input {
    border: none;
    padding: 8px;
    outline: none;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    text-align: center;
    background: rgba(255,255,255,0.2);
  }

  /* ─── BOUTON MODIFIER DATE ─── */
  #edit-date-btn {
    margin-top: 20px;
    background: rgba(255, 255, 255, 0.3);
    border: none;
    border-radius: 12px;
    padding: 8px 20px;
    font-family: 'Poppins', sans-serif;
    font-size: 0.85em;
    font-weight: 700;
    color: #ff3366;
    cursor: pointer;
    box-shadow: 0 3px 10px rgba(0,0,0,0.08);
    transition: transform 0.2s, box-shadow 0.2s;
    opacity: 0.75;
  }
  #edit-date-btn:hover { transform: scale(1.05); opacity: 1; box-shadow: 0 5px 15px rgba(255,51,102,0.2); }

  /* ─── MODALE DATE ─── */
  /* Piège : backdrop-filter ignoré sur iOS Safari < 15 ; le fond rgba sert de fallback. */
  #date-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(255, 102, 153, 0.12);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 200;
    justify-content: center;
    align-items: center;
  }
  #date-overlay.open { display: flex; }

  #date-card {
    background: rgba(255, 255, 255, 0.9);
    border-radius: 22px;
    padding: 32px 28px;
    box-shadow: 0 12px 40px rgba(255, 51, 102, 0.18);
    display: flex;
    flex-direction: column;
    gap: 18px;
    align-items: center;
    min-width: 290px;
    animation: fadeIn 0.25s ease;
  }
  #date-card h2 { margin: 0; font-size: 1.25em; color: #ff3366; }

  /* datetime-local : natif, accessible. Piège : valeur en heure locale de l'appareil. */
  #date-input {
    width: 100%;
    box-sizing: border-box;
    border: 2px solid rgba(255, 51, 102, 0.25);
    border-radius: 12px;
    padding: 10px 14px;
    font-family: 'Poppins', sans-serif;
    font-size: 1em;
    color: #ff3366;
    background: rgba(255,255,255,0.7);
    outline: none;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  #date-input:focus { border-color: #ff3366; }

  .card-actions { display: flex; gap: 10px; width: 100%; }
  .card-btn {
    flex: 1;
    border: none;
    border-radius: 12px;
    padding: 11px;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 0.95em;
    cursor: pointer;
    transition: transform 0.2s;
  }
  .card-btn:hover { transform: scale(1.03); }
  .card-btn.confirm { background: linear-gradient(135deg, #ff3366, #ff6699); color: white; box-shadow: 0 4px 14px rgba(255,51,102,0.3); }
  .card-btn.cancel  { background: rgba(255,255,255,0.5); color: #ff3366; border: 2px solid rgba(255,51,102,0.25); }

  /* ─── ANIMATIONS ─── */
  .pulse-emoji { display: inline-block; animation: pulse 1s infinite; }
  @keyframes pulse  { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

  /* ─── RESPONSIVE ─── */
  @media (max-width: 400px) {
    #timer      { font-size: 2em; gap: 10px; }
    .time-block { padding: 10px 15px; }
    h1          { font-size: 2em; margin-bottom: 20px; }
    #chat       { width: 180px; height: 200px; }
    #date-card  { min-width: 250px; padding: 22px 18px; }
  }
</style>
</head>
<body>

<div id="since" class="time-block"></div>

<h1>Compte à rebours pour notre date ❤️</h1>

<div id="timer">
  <div class="time-block" id="days">0j</div>
  <div class="time-block" id="hours">0h</div>
  <div class="time-block" id="minutes">0m</div>
  <div class="time-block" id="seconds">0s</div>
</div>

<button id="edit-date-btn">✏️ Modifier la date</button>

<div id="date-overlay">
  <div id="date-card">
    <h2>📅 Choisir la date du rdv</h2>
    <input type="datetime-local" id="date-input" />
    <div class="card-actions">
      <button class="card-btn cancel"  id="cancel-btn">Annuler</button>
      <button class="card-btn confirm" id="confirm-btn">Confirmer 💕</button>
    </div>
  </div>
</div>

<div id="chat">
  <div id="messages"></div>
  <!-- AJOUT : maxlength limite la taille côté client (à doubler côté règles Firestore) -->
  <input id="msgInput" placeholder="Écris ici..." maxlength="500" />
</div>

<script type="module">
  /* IMPORTS FIRESTORE
     Nouveaux : query, orderBy, limitToLast (tri/limite), serverTimestamp (heure serveur).
     Doc : https://firebase.google.com/docs/web/modular-upgrade */
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
  import {
    getFirestore, collection, addDoc, onSnapshot, doc, setDoc,
    query, orderBy, limitToLast, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

  /* INITIALISATION FIREBASE
     Sécurité : la apiKey n'est pas un secret, c'est la protection des règles Firestore
     (+ auth) qui compte. Restreins aussi la clé par référent HTTP dans Google Cloud Console. */
  const firebaseConfig = {
    apiKey:            "AIzaSyDVI5b8v8oagpWPOnmVmUlN6tRBLOjzN8Y",
    authDomain:        "ladybug-7f168.firebaseapp.com",
    projectId:         "ladybug-7f168",
    storageBucket:     "ladybug-7f168.appspot.com",
    messagingSenderId: "558949565079",
    appId:             "1:558949565079:web:9483c4aa7ba3d386549fd2",
    measurementId:     "G-SNLE8M0K3B"
  };
  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);

  const chatCollection = collection(db, "messages");
  const configDoc      = doc(db, "config", "eventDate");

  /* ──────────────────────────────────────────────────
   * CHAT
   * ────────────────────────────────────────────────── */
  const messagesDiv = document.getElementById("messages");
  const msgInput    = document.getElementById("msgInput");

  /* Identifiant de session (conservé, plus utilisé pour l'affichage).
     Non sécurisé : généré côté client, donc falsifiable. */
  let userId = localStorage.getItem("userId");
  if (!userId) {
    userId = Math.random().toString(36).substring(2, 10);
    localStorage.setItem("userId", userId);
  }

  /* CAUSE DU DÉSORDRE : sans orderBy, Firestore trie par ID de document (aléatoire).
     Ici : tri croissant sur createdAt (heure SERVEUR), limité aux 100 derniers
     (limitToLast exige un orderBy). Pas d'index composite requis pour un seul champ.
     ⚠️ Les anciens messages sans createdAt sont exclus de cette requête (restent en base).
     Doc : https://firebase.google.com/docs/firestore/query-data/order-limit-data */
  const chatQuery = query(chatCollection, orderBy("createdAt", "asc"), limitToLast(100));

  /**
   * Renvoie "pink" ou "blue" pour CET appareil.
   * ⚠️ Le navigateur ne donne PAS le modèle d'iPhone (user-agent figé par Apple) :
   * on déduit d'après la taille d'écran. Cas ambigus : XR/XS Max (classés 11+),
   * SE 2/3 (classés ≤10), "Zoom d'affichage" ou "version bureau" activés.
   * Forçage manuel : ouvre la page une fois avec ?couleur=pink ou ?couleur=blue
   * (mémorisé en localStorage).
   * Docs : https://developer.mozilla.org/en-US/docs/Web/API/Screen/width
   *        https://developer.mozilla.org/en-US/docs/Web/API/URLSearchParams
   */
  function detectChatColor() {
    const forced = new URLSearchParams(location.search).get("couleur");
    if (forced === "pink" || forced === "blue") localStorage.setItem("chatColor", forced);

    const saved = localStorage.getItem("chatColor");
    if (saved === "pink" || saved === "blue") return saved;

    if (/iPhone/i.test(navigator.userAgent)) {
      // max() : screen.width/height peuvent s'inverser selon l'orientation.
      // ≥ 812 pt → X et plus récents ; ≤ 736 pt → 8 et plus anciens.
      const longSide = Math.max(screen.width, screen.height);
      return longSide >= 812 ? "pink" : "blue";
    }
    return "blue"; // Android, ordinateur, iPad (qui se présente comme un Mac)…
  }
  const chatColor = detectChatColor();

  /* Rendu : reconstruit la liste à chaque snapshot (OK pour ≤100 messages).
     Alternative : snapshot.docChanges() pour n'ajouter que le nouveau.
     Le 2e argument d'onSnapshot est le callback d'erreur (règles refusées, réseau…).
     Doc : https://firebase.google.com/docs/firestore/query-data/listen */
  onSnapshot(chatQuery, (snapshot) => {
    messagesDiv.replaceChildren(); // https://developer.mozilla.org/en-US/docs/Web/API/Element/replaceChildren
    snapshot.forEach((docSnap) => {
      const data = docSnap.data();
      const msg  = document.createElement("div");
      msg.textContent = data.text; // textContent → pas d'injection HTML (XSS)

      // Whitelist : jamais de valeur Firestore brute dans className (la base est écrivable par tous).
      msg.className = "msg " + (data.color === "pink" ? "msg--pink" : "msg--blue");
      messagesDiv.appendChild(msg);
    });
    messagesDiv.scrollTop = messagesDiv.scrollHeight; // toujours sur le dernier message
  }, (err) => console.error("Chat : lecture refusée ou échouée", err));

  /* Envoi.
     - keydown au lieu de keypress (déprécié) :
       https://developer.mozilla.org/en-US/docs/Web/API/Element/keypress_event
     - e.isComposing ignore l'Entrée qui valide une suggestion de clavier mobile :
       https://developer.mozilla.org/en-US/docs/Web/API/KeyboardEvent/isComposing
     - serverTimestamp : l'heure vient du serveur (Date.now() réintroduirait du désordre
       car les horloges des deux téléphones diffèrent) :
       https://firebase.google.com/docs/firestore/manage-data/add-data#server_timestamp */
  msgInput.addEventListener("keydown", async (e) => {
    if (e.key !== "Enter" || e.isComposing) return;
    const text = msgInput.value.trim();
    if (!text) return;

    msgInput.value = ""; // vidé AVANT l'await : évite le double envoi
    try {
      await addDoc(chatCollection, { text, userId, color: chatColor, createdAt: serverTimestamp() });
    } catch (err) {
      console.error("Envoi échoué", err);
      msgInput.value = text; // on rend le texte à l'utilisateur
    }
  });

  /* ──────────────────────────────────────────────────
   * COMPTE À REBOURS
   * onSnapshot sur config/eventDate → restartTimer() recrée toujours les 4 blocs
   * (évite de mettre à jour des éléments remplacés par le message de fin).
   * ────────────────────────────────────────────────── */
  const DEFAULT_ISO = "2026-05-29T12:05:00";
  let eventDate     = new Date(DEFAULT_ISO);
  let timerInterval = null;

  onSnapshot(configDoc, (snap) => {
    if (snap.exists()) eventDate = new Date(snap.data().iso); // ISO 8601, parsé nativement
    restartTimer();
  }, (err) => console.error("Config : lecture échouée", err));

  /** Toujours clearInterval avant setInterval : jamais deux intervalles en parallèle. */
  function restartTimer() {
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }

    document.getElementById("timer").innerHTML = `
      <div class="time-block" id="days">0j</div>
      <div class="time-block" id="hours">0h</div>
      <div class="time-block" id="minutes">0m</div>
      <div class="time-block" id="seconds">0s</div>
    `;
    updateTimer();
    timerInterval = setInterval(updateTimer, 1000);
  }

  /** Si diff <= 0 : message aléatoire et arrêt de l'intervalle.
   *  Maintenabilité/sécurité : innerHTML est sûr ICI car le texte vient d'un tableau en dur.
   *  Si ces textes venaient un jour de Firestore → faille XSS.
   *  Regex Unicode : Emoji_Presentation ne couvre pas ❤, d'où Extended_Pictographic.
   *  https://www.unicode.org/reports/tr51/#Emoji_Properties */
  function updateTimer() {
    const diff = eventDate - new Date();

    if (diff <= 0) {
      const endings = [
        "C'est notre moment 😘",
        "Grr can't wait de te voir 🫦",
        "Encore un jour ensemble 💕",
        "Je pense à nous 💖",
        "Trop hâte de te retrouver 😍",
        "cant wait de regarder des films avec toi 🫦",
        "Tu me manques 💌",
        "Mon cœur est à toi 💓",
        "Hâte de nos câlins 🤗",
        "j'espere que chaplapla sera presente🐈",
        "hate de jouer a rayman avec toi🎮",
        "hate de te cuddle dans le bed 🐞",
        "merci d'etre mon ame soeur🩷"
      ];
      const txt = endings[Math.floor(Math.random() * endings.length)];
      const withPulse = txt.replace(
        /(\p{Emoji_Presentation}|\p{Extended_Pictographic})/gu,
        '<span class="pulse-emoji">$&</span>'
      );
      document.getElementById("timer").innerHTML = `<div class='time-block'>${withPulse}</div>`;
      clearInterval(timerInterval);
      timerInterval = null;
      return;
    }

    document.getElementById("days").innerText    = `${Math.floor(diff / 86400000)}j`;
    document.getElementById("hours").innerText   = `${Math.floor(diff / 3600000) % 24}h`;
    document.getElementById("minutes").innerText = `${Math.floor(diff / 60000)   % 60}m`;
    document.getElementById("seconds").innerText = `${Math.floor(diff / 1000)    % 60}s`;
  }

  /* ──────────────────────────────────────────────────
   * MODALE DE DATE
   * Clic "Modifier" → pré-remplit ; "Confirmer" → setDoc → onSnapshot → restartTimer.
   * setDoc (et non updateDoc) : document à un seul champ, il est simplement écrasé.
   * https://firebase.google.com/docs/firestore/manage-data/add-data#set_a_document
   * ────────────────────────────────────────────────── */
  const overlay    = document.getElementById("date-overlay");
  const dateInput  = document.getElementById("date-input");
  const editBtn    = document.getElementById("edit-date-btn");
  const cancelBtn  = document.getElementById("cancel-btn");
  const confirmBtn = document.getElementById("confirm-btn");

  /** Date → "YYYY-MM-DDTHH:MM" en heure LOCALE (toISOString donne de l'UTC : on compense). */
  function toLocalInputValue(date) {
    const offset = date.getTimezoneOffset() * 60000;
    return new Date(date - offset).toISOString().slice(0, 16);
  }

  editBtn.addEventListener("click", () => {
    dateInput.value = toLocalInputValue(eventDate);
    overlay.classList.add("open");
  });
  cancelBtn.addEventListener("click", () => overlay.classList.remove("open"));
  overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.classList.remove("open"); });

  confirmBtn.addEventListener("click", async () => {
    const val = dateInput.value;
    if (!val) return;
    const newDate = new Date(val);
    if (isNaN(newDate.getTime())) return;

    /* MODIF : try/catch. Avant, si les règles refusaient l'écriture, le bouton ne faisait
       rien sans aucun retour. On garde la modale ouverte pour pouvoir réessayer. */
    try {
      await setDoc(configDoc, { iso: newDate.toISOString() }); // ISO UTC, non ambigu
      overlay.classList.remove("open");
    } catch (err) {
      console.error("Enregistrement de la date échoué", err);
      alert("Impossible d'enregistrer la date. Réessaie 🙏");
    }
  });

  /* ──────────────────────────────────────────────────
   * BADGE "DEPUIS N JOURS"
   * ────────────────────────────────────────────────── */
  const startDate = new Date(2025, 7, 12); // mois 0-indexé : 7 = août

  function updateSince() {
    const days = Math.floor((Date.now() - startDate) / 86400000);
    document.getElementById("since").innerText = `${days} jours 💕`;
  }
  updateSince();
  setInterval(updateSince, 60000);
</script>

</body>
</html>
