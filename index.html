<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<!-- AJOUT : sans cette balise, Safari iOS rend la page en ~980px et les @media ne se déclenchent pas.
     Doc : https://developer.mozilla.org/en-US/docs/Web/HTML/Viewport_meta_tag -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LadyBug</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;700&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" sizes="192x192" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">

<style>
  /* ═══════════════════════════════════════════════════════════
     MOBILE-FIRST, calé sur iPhone 11 : 414 × 896 pt (écran @2x),
     encoche en haut (~48 pt), barre d'accueil en bas (~34 pt).
     Version "fine" : polices, paddings, rayons, ombres et cadres réduits.
     Rien d'autre n'a bougé (couleurs, positions, logique).
     ═══════════════════════════════════════════════════════════ */

  /* ─── BASE ─── */
  html { -webkit-text-size-adjust: 100%; } /* empêche iOS de regonfler les polices en paysage */

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    box-sizing: border-box;
    height: 100vh;   /* fallback anciens navigateurs */
    height: 100dvh;  /* hauteur visible réelle (barre Safari comprise) */
    margin: 0;
    /* env(safe-area-inset-*) : marges d'encoche/barre d'accueil. Vaut 0 si absentes.
       Exige viewport-fit=cover dans la balise <meta viewport>.
       Doc : https://developer.mozilla.org/en-US/docs/Web/CSS/env */
    padding: calc(env(safe-area-inset-top, 0px) + 14px) 16px calc(env(safe-area-inset-bottom, 0px) + 16px);
    background: linear-gradient(135deg, #ffe6f0, #fff0f5);
    font-family: 'Poppins', sans-serif;
    color: #ff3366;
    text-align: center;
    -webkit-tap-highlight-color: transparent; /* pas de flash gris au toucher sur iOS */
  }

  h1 {
    margin: auto 0 14px;
    /* FIN : max 2.5rem → 1.8rem, min 1.25rem → 1rem
       Doc : https://developer.mozilla.org/en-US/docs/Web/CSS/clamp */
    font-size: clamp(1rem, 4.5vw, 1.8rem);
    line-height: 1.25;
  }

  /* ─── COMPTEUR : 4 colonnes égales sur toute la largeur ─── */
  /* minmax(0,1fr) (et pas 1fr seul) : sinon une colonne peut dépasser son 1/4
     si le contenu est large (piège classique des grilles).
     Doc : https://developer.mozilla.org/en-US/docs/Web/CSS/minmax */
  #timer {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 6px;                                /* FIN : 8 → 6 */
    width: 100%;
    max-width: 340px;                        /* FIN : 400 → 340 */
    font-size: clamp(1rem, 4.5vw, 1.8rem);   /* FIN : police réduite */
    font-weight: bold;
    animation: fadeIn 1s ease-in-out;
  }
  .time-block {
    background: rgba(255, 255, 255, 0.3);
    padding: 8px 2px;                        /* FIN : 12 → 8 */
    border-radius: 10px;                     /* FIN : 14 → 10 */
    box-shadow: 0 3px 10px rgba(0,0,0,0.08); /* FIN : ombre plus légère */
    transition: transform 0.3s;
  }
  /* Message de fin (un seul bloc) : toute la largeur + police plus petite. */
  #timer .time-block:only-child {
    grid-column: 1 / -1;
    font-size: 0.65em;
    padding: 12px 10px;                      /* FIN : 16/12 → 12/10 */
    line-height: 1.4;
  }

  /* ─── BADGE "DEPUIS" : dans le flux, centré en haut ─── */
  #since {
    padding: 4px 12px;                       /* FIN : 6/16 → 4/12 */
    font-size: 0.85rem;                      /* FIN : 1rem → 0.85rem */
    font-weight: 700;
  }

  /* ─── BOUTON MODIFIER LA DATE ─── */
  /* FIN : 44 → 40 px de haut. Apple recommande 44 pt pour une cible tactile :
     40 reste confortable au pouce, mais ne descends pas plus bas. */
  #edit-date-btn {
    margin-top: 14px;                        /* FIN : 18 → 14 */
    min-height: 40px;
    padding: 8px 18px;                       /* FIN : 10/22 → 8/18 */
    background: rgba(255, 255, 255, 0.3);
    border: none;
    border-radius: 10px;                     /* FIN : 12 → 10 */
    font-family: 'Poppins', sans-serif;
    font-size: 0.8rem;                       /* FIN : 0.9 → 0.8rem */
    font-weight: 700;
    color: #ff3366;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    transition: transform 0.2s, box-shadow 0.2s;
    opacity: 0.75;
  }

  /* ─── CHAT : carte pleine largeur en bas (plus de position:absolute) ─── */
  #chat {
    box-sizing: border-box;
    width: 100%;
    max-width: 340px;                        /* FIN : 400 → 340 */
    flex: 0 1 auto;
    height: 32dvh;                           /* FIN : 38 → 32 dvh */
    min-height: 140px;                       /* FIN : 170 → 140 */
    margin-top: auto;
    background: rgba(255,255,255,0.3);
    border-radius: 14px;                     /* FIN : 18 → 14 */
    box-shadow: 0 3px 10px rgba(0,0,0,0.15); /* FIN : ombre plus légère */
    display: flex;
    flex-direction: column;
    padding: 8px;                            /* FIN : 10 → 8 */
    gap: 8px;                                /* FIN : 10 → 8 */
    overflow: hidden;
  }

  /* flex:1 + min-height:0 → c'est #messages qui scrolle, pas #chat.
     Doc : https://developer.mozilla.org/en-US/docs/Web/CSS/min-height */
  #messages {
    display: flex;
    flex-direction: column;
    gap: 5px;                                /* FIN : 6 → 5 */
    width: 100%;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  #messages div {
    max-width: 82%;
    padding: 4px 10px;                       /* FIN : 6/12 → 4/10 */
    border-radius: 10px;                     /* FIN : 12 → 10 */
    font-size: 0.85rem;                      /* FIN : 0.95 → 0.85rem */
    line-height: 1.3;
    word-break: break-word;
    text-align: left;
    background: rgba(255,255,255,0.3);
  }

  /* Pousse la pile de messages vers le bas (style chat standard).
     Doc : https://developer.mozilla.org/en-US/docs/Web/CSS/margin */
  #messages > :first-child { margin-top: auto; }

  /* ⚠️ font-size 16px CONSERVÉ volontairement : en dessous, Safari iOS zoome la page
     au focus de l'input et ne dézoome pas toujours. Seuls hauteur, padding et rayon sont réduits. */
  #chat input {
    box-sizing: border-box;
    width: 100%;
    min-height: 38px;                        /* FIN : 44 → 38 */
    border: none;
    border-radius: 10px;                     /* FIN : 12 → 10 */
    padding: 6px 10px;                       /* FIN : 8/12 → 6/10 */
    outline: none;
    font-family: 'Poppins', sans-serif;
    font-size: 16px;                         /* NE PAS BAISSER (zoom iOS) */
    font-weight: 700;
    text-align: center;
    background: rgba(255,255,255,0.2);
  }

  /* ─── MODALE DATE ─── */
  /* Piège : backdrop-filter ignoré sur iOS Safari < 15 ; le fond rgba sert de fallback. */
  #date-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(255, 102, 153, 0.12);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 200;
    justify-content: center;
    align-items: center;
    padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px);
  }
  #date-overlay.open { display: flex; }

  #date-card {
    box-sizing: border-box;
    width: min(100%, 290px);                 /* FIN : 340 → 290 */
    background: rgba(255, 255, 255, 0.92);
    border-radius: 16px;                     /* FIN : 22 → 16 */
    padding: 18px 16px;                      /* FIN : 26/20 → 18/16 */
    box-shadow: 0 8px 28px rgba(255, 51, 102, 0.15);
    display: flex;
    flex-direction: column;
    gap: 14px;                               /* FIN : 18 → 14 */
    align-items: center;
    animation: fadeIn 0.25s ease;
  }
  #date-card h2 { margin: 0; font-size: 1rem; color: #ff3366; } /* FIN : 1.15 → 1rem */

  #date-input {
    width: 100%;
    box-sizing: border-box;
    min-height: 40px;                        /* FIN : 44 → 40 */
    border: 1.5px solid rgba(255, 51, 102, 0.25); /* FIN : 2 → 1.5px */
    border-radius: 10px;
    padding: 8px 12px;
    font-family: 'Poppins', sans-serif;
    font-size: 16px;                         /* NE PAS BAISSER (zoom iOS) */
    color: #ff3366;
    background: rgba(255,255,255,0.7);
    outline: none;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  #date-input:focus { border-color: #ff3366; }

  .card-actions { display: flex; gap: 8px; width: 100%; }
  .card-btn {
    flex: 1;
    min-height: 40px;                        /* FIN : 46 → 40 */
    border: none;
    border-radius: 10px;
    padding: 8px;
    font-family: 'Poppins', sans-serif;
    font-weight: 700;
    font-size: 0.85rem;                      /* FIN : 0.95 → 0.85rem */
    cursor: pointer;
    transition: transform 0.2s;
  }
  .card-btn.confirm { background: linear-gradient(135deg, #ff3366, #ff6699); color: white; box-shadow: 0 3px 10px rgba(255,51,102,0.25); }
  .card-btn.cancel  { background: rgba(255,255,255,0.5); color: #ff3366; border: 1.5px solid rgba(255,51,102,0.25); }

  /* ─── SURVOL : uniquement pour souris ─── */
  /* Sur tactile, :hover "colle" après un tap. On le réserve aux appareils avec vrai survol.
     Doc : https://developer.mozilla.org/en-US/docs/Web/CSS/@media/hover */
  @media (hover: hover) {
    .time-block:hover { transform: scale(1.05); }
    #edit-date-btn:hover { transform: scale(1.05); opacity: 1; box-shadow: 0 5px 15px rgba(255,51,102,0.2); }
    .card-btn:hover { transform: scale(1.03); }
  }

  /* ─── ANIMATIONS ─── */
  .pulse-emoji { display: inline-block; animation: pulse 1s infinite; }
  @keyframes pulse  { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.3); } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

  /* Respecte le réglage iOS « Réduire les animations » (accessibilité). */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }

  /* ═══════════════════════════════════════════════════════════
     DISPOSITION MOBILE UNIQUEMENT (< 700 px)
       • compteur de jours : PETIT, tout en haut à gauche
       • chat              : PETIT, à droite (en haut, symétrique du compteur)
       • titre + compte à rebours + bouton « Modifier la date » : au milieu
     699.98px (et pas 700px) évite qu'un écran de 700 px pile tombe dans les deux blocs.
     Doc : https://developer.mozilla.org/en-US/docs/Web/CSS/CSS_media_queries/Using_media_queries
     ═══════════════════════════════════════════════════════════ */
  @media (max-width: 699.98px) {
    body { position: relative; justify-content: center; }

    /* ─── MILIEU ─── */
    h1 { margin: 0 0 14px; font-size: clamp(1.2rem, 6vw, 2rem); }   /* FIN : 1.5/7.5vw/2.5 → 1.2/6vw/2 */

    #timer {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;                                                      /* FIN : 10 → 8 */
      font-size: clamp(1.5rem, 8vw, 2.5rem);                         /* FIN : 2/11vw/3.5 → 1.5/8vw/2.5 */
    }
    .time-block { padding: 10px 4px; }                               /* FIN : 14 → 10 */

    #edit-date-btn {
      margin-top: 16px;                                              /* FIN : 22 → 16 */
      min-height: 42px;                                              /* FIN : 52 → 42 */
      padding: 10px 22px;                                            /* FIN : 12/28 → 10/22 */
      font-size: 0.9rem;                                             /* FIN : 1.1 → 0.9rem */
    }

    /* ─── COMPTEUR DE JOURS, EN PETIT, HAUT GAUCHE ─── */
    #since {
      position: absolute;
      top: calc(env(safe-area-inset-top, 0px) + 14px);
      left: 16px;
      padding: 3px 8px;                                              /* FIN : 4/10 → 3/8 */
      font-size: 0.7rem;                                             /* FIN : 0.8 → 0.7rem */
    }

    /* ─── CHAT, EN PETIT, À DROITE (en haut, en face du compteur) ─── */
    /* Pour le descendre dans le coin bas-droit : remplacer "top: calc(...)" par
       "bottom: calc(env(safe-area-inset-bottom, 0px) + 16px)". */
    #chat {
      position: absolute;
      top: calc(env(safe-area-inset-top, 0px) + 14px);
      right: 16px;
      width: 140px;                                                  /* FIN : 160 → 140 */
      height: 160px;                                                 /* FIN : 190 → 160 */
      min-height: 0;
      margin-top: 0;
    }
  }

  /* ═══════════════════════════════════════════════════════════
     BUREAU / TABLETTE / iPhone en paysage (≥ 700 px) :
     badge en haut à gauche, chat en haut à droite, compte à rebours centré.
     ═══════════════════════════════════════════════════════════ */
  @media (min-width: 700px) {
    body { position: relative; justify-content: center; padding: 16px; }
    h1 { margin: 0 0 24px; font-size: 1.8rem; }                      /* FIN : 2.5 → 1.8rem */

    #timer {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;                                                     /* FIN : 15 → 12 */
      width: auto;
      max-width: none;
      font-size: 1.8rem;                                             /* FIN : 2.5 → 1.8rem */
    }
    .time-block { padding: 10px 20px; border-radius: 12px; }         /* FIN : 15/25, 15 → 10/20, 12 */
    #timer .time-block:only-child { font-size: 1em; padding: 10px 20px; }

    #since { position: absolute; top: 15px; left: 15px; font-size: 1rem; padding: 6px 12px; } /* FIN : 1.2rem, 8/15 → 1rem, 6/12 */

    #edit-date-btn { margin-top: 16px; }                             /* FIN : 20 → 16 */

    #chat {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 190px;                                                  /* FIN : 220 → 190 */
      height: 210px;                                                 /* FIN : 250 → 210 */
      min-height: 0;
      margin-top: 0;
      border-radius: 12px;                                           /* FIN : 15 → 12 */
    }
    #messages div { font-size: 0.9rem; padding: 4px 8px; border-radius: 8px; } /* FIN : 1rem, 5/10, 10 → 0.9rem, 4/8, 8 */
  }
</style>
</head>
<body>

<div id="since" class="time-block"></div>

<h1>Compte à rebours pour notre date ❤️</h1>

<div id="timer">
  <div class="time-block" id="days">0j</div>
  <div class="time-block" id="hours">0h</div>
  <div class="time-block" id="minutes">0m</div>
  <div class="time-block" id="seconds">0s</div>
</div>

<button id="edit-date-btn">✏️ Modifier la date</button>

<div id="date-overlay">
  <div id="date-card">
    <h2>📅 Choisir la date du rdv</h2>
    <input type="datetime-local" id="date-input" />
    <div class="card-actions">
      <button class="card-btn cancel"  id="cancel-btn">Annuler</button>
      <button class="card-btn confirm" id="confirm-btn">Confirmer 💕</button>
    </div>
  </div>
</div>

<div id="chat">
  <div id="messages"></div>
  <input id="msgInput" placeholder="Écris ici..." />
</div>

<script type="module">
  /*
   * IMPORTS FIRESTORE
   * setDoc est ajouté par rapport à l'original pour sauvegarder la date cible.
   * doc() permet de cibler un document précis (config/eventDate).
   * serverTimestamp (NOUVEAU) : horodatage fourni par le serveur, pour trier les messages.
   *
   * Ref MDN ESModule : https://developer.mozilla.org/en-US/docs/Web/JavaScript/Guide/Modules
   * Ref Firebase Web SDK v9 (modular) : https://firebase.google.com/docs/web/modular-upgrade
   * Ref Server timestamp : https://firebase.google.com/docs/firestore/manage-data/add-data#server_timestamp
   */
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
  import {
    getFirestore, collection, addDoc, onSnapshot, doc, setDoc, serverTimestamp
  } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore.js";

  /* INITIALISATION FIREBASE
     Sécurité : la apiKey n'est pas un secret, c'est la protection des règles Firestore
     (+ auth) qui compte. Restreins aussi la clé par référent HTTP dans Google Cloud Console. */
  const firebaseConfig = {
    apiKey:            "AIzaSyDVI5b8v8oagpWPOnmVmUlN6tRBLOjzN8Y",
    authDomain:        "ladybug-7f168.firebaseapp.com",
    projectId:         "ladybug-7f168",
    storageBucket:     "ladybug-7f168.appspot.com",
    messagingSenderId: "558949565079",
    appId:             "1:558949565079:web:9483c4aa7ba3d386549fd2",
    measurementId:     "G-SNLE8M0K3B"
  };
  const app = initializeApp(firebaseConfig);
  const db  = getFirestore(app);

  const chatCollection = collection(db, "messages");
  const configDoc      = doc(db, "config", "eventDate");

  /* ──────────────────────────────────────────────────
   * CHAT
   * Modifié : couleur selon l'appareil, tri chronologique, alignement selon la couleur.
   * ────────────────────────────────────────────────── */
  const messagesDiv = document.getElementById("messages");
  const msgInput    = document.getElementById("msgInput");

  const isAndroid = /Android/i.test(navigator.userAgent); // gardé : le champ "os" reste écrit en base

  /* Rose / bleu : mêmes couleurs qu'avant, seule la règle d'attribution change. */
  const colorPink = "#ff3366";
  const colorBlue = "#a0c4ff";

  /* Appareil de l'expéditeur : "pink" = iPhone à encoche (11 et plus), "blue" = tout le reste.
     Piège : un navigateur ne donne PAS le modèle exact d'un iPhone (Safari fige le user-agent).
     On se base sur la taille d'écran : tous les iPhone à encoche ont un côté long ≥ 812 pt.
     Conséquence : iPhone X / XS / XR / XS Max (antérieurs au 11) sont classés "pink" par erreur,
     car leurs dimensions sont identiques à celles de modèles récents.
     Math.max(width, height) : protège d'une éventuelle rotation.
     Doc : https://developer.mozilla.org/en-US/docs/Web/API/Screen/width
           https://developer.mozilla.org/en-US/docs/Web/API/Navigator/userAgent */
  function detectColor() {
    const isIPhone = /iPhone/.test(navigator.userAgent);
    const longSide = Math.max(screen.width, screen.height);
    return (isIPhone && longSide >= 812) ? "pink" : "blue";
  }
  const myColor = detectColor();

  /*
   * Identifiant de session persisté en localStorage.
   * Permet de distinguer "mes messages" vs "ses messages" côté client.
   * Piège : localStorage est partagé si les deux utilisent le même navigateur
   * sur le même appareil — cas peu probable pour un couple sur deux téléphones.
   */
  let userId = localStorage.getItem("userId");
  if (!userId) {
    userId = Math.random().toString(36).substring(2, 10);
    localStorage.setItem("userId", userId);
  }

  onSnapshot(chatCollection, (snapshot) => {
    /* Pourquoi l'ordre était aléatoire : sans tri, Firestore renvoie les documents par ID,
       et addDoc génère des IDs aléatoires.
       Tri côté client plutôt que query(orderBy("createdAt")) : orderBy EXCLUT les anciens
       messages qui n'ont pas ce champ (ils disparaîtraient). Ici ils restent, placés en premier.
       { serverTimestamps: "estimate" } : un message tout juste envoyé a createdAt = null
       le temps que le serveur réponde ; "estimate" évite qu'il saute au mauvais endroit.
       Doc : https://firebase.google.com/docs/reference/js/firestore_.documentsnapshot#documentsnapshotdata */
    const messages = snapshot.docs
      .map((d) => d.data({ serverTimestamps: "estimate" }))
      .sort((a, b) => (a.createdAt?.toMillis() ?? 0) - (b.createdAt?.toMillis() ?? 0));

    messagesDiv.innerHTML = "";
    messages.forEach((data) => {
      const msg = document.createElement("div");
      msg.textContent = data.text; // textContent (pas innerHTML) : pas de faille XSS

      /* Anciens messages sans champ "color" : on retombe sur l'ancien champ "os". */
      const color  = data.color ?? (data.os === "Android" ? "blue" : "pink");
      const isPink = color === "pink";

      msg.style.color     = isPink ? colorPink : colorBlue;
      msg.style.alignSelf = isPink ? "flex-end" : "flex-start"; // rose = droite, bleu = gauche
      /* Fond conservé tel quel : un peu plus marqué pour tes propres messages. */
      msg.style.background = data.userId === userId
        ? "rgba(255,255,255,0.3)"
        : "rgba(255,255,255,0.2)";

      messagesDiv.appendChild(msg);
    });
    messagesDiv.scrollTop = messagesDiv.scrollHeight; // le plus récent reste visible en bas
  });

  msgInput.addEventListener("keypress", async (e) => {
    if (e.key === "Enter" && msgInput.value.trim() !== "") {
      await addDoc(chatCollection, {
        text:      msgInput.value,
        userId:    userId,
        os:        isAndroid ? "Android" : "iOS",
        color:     myColor,              // NOUVEAU : couleur figée à l'envoi
        createdAt: serverTimestamp()     // NOUVEAU : horloge du serveur, pas celle du téléphone
      });
      msgInput.value = "";
    }
  });

  /* ──────────────────────────────────────────────────
   * COMPTE À REBOURS
   * onSnapshot sur config/eventDate → restartTimer() recrée toujours les 4 blocs
   * (évite de mettre à jour des éléments remplacés par le message de fin).
   * ────────────────────────────────────────────────── */
  const DEFAULT_ISO = "2026-05-29T12:05:00";
  let eventDate     = new Date(DEFAULT_ISO);
  let timerInterval = null;

  onSnapshot(configDoc, (snap) => {
    if (snap.exists()) eventDate = new Date(snap.data().iso); // ISO 8601, parsé nativement
    restartTimer();
  });

  /** Toujours clearInterval avant setInterval : jamais deux intervalles en parallèle. */
  function restartTimer() {
    if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }

    document.getElementById("timer").innerHTML = `
      <div class="time-block" id="days">0j</div>
      <div class="time-block" id="hours">0h</div>
      <div class="time-block" id="minutes">0m</div>
      <div class="time-block" id="seconds">0s</div>
    `;
    updateTimer();
    timerInterval = setInterval(updateTimer, 1000);
  }

  /** Si diff <= 0 : message aléatoire et arrêt de l'intervalle.
   *  Maintenabilité/sécurité : innerHTML est sûr ICI car le texte vient d'un tableau en dur.
   *  Si ces textes venaient un jour de Firestore → faille XSS.
   *  Regex Unicode : Emoji_Presentation ne couvre pas ❤, d'où Extended_Pictographic.
   *  https://www.unicode.org/reports/tr51/#Emoji_Properties */
  function updateTimer() {
    const diff = eventDate - new Date();

    if (diff <= 0) {
      const endings = [
        "C'est notre moment 😘",
        "Grr can't wait de te voir 🫦",
        "Encore un jour ensemble 💕",
        "Je pense à nous 💖",
        "Trop hâte de te retrouver 😍",
        "cant wait de regarder des films avec toi 🫦",
        "Tu me manques 💌",
        "Mon cœur est à toi 💓",
        "Hâte de nos câlins 🤗",
        "j'espere que chaplapla sera presente🐈",
        "hate de jouer a rayman avec toi🎮",
        "hate de te cuddle dans le bed 🐞",
        "merci d'etre mon ame soeur🩷"
      ];
      const txt = endings[Math.floor(Math.random() * endings.length)];
      const withPulse = txt.replace(
        /(\p{Emoji_Presentation}|\p{Extended_Pictographic})/gu,
        '<span class="pulse-emoji">$&</span>'
      );
      document.getElementById("timer").innerHTML = `<div class='time-block'>${withPulse}</div>`;
      clearInterval(timerInterval);
      timerInterval = null;
      return;
    }

    document.getElementById("days").innerText    = `${Math.floor(diff / 86400000)}j`;
    document.getElementById("hours").innerText   = `${Math.floor(diff / 3600000) % 24}h`;
    document.getElementById("minutes").innerText = `${Math.floor(diff / 60000)   % 60}m`;
    document.getElementById("seconds").innerText = `${Math.floor(diff / 1000)    % 60}s`;
  }

  /* ──────────────────────────────────────────────────
   * MODALE DE DATE
   * Clic "Modifier" → pré-remplit ; "Confirmer" → setDoc → onSnapshot → restartTimer.
   * setDoc (et non updateDoc) : document à un seul champ, il est simplement écrasé.
   * https://firebase.google.com/docs/firestore/manage-data/add-data#set_a_document
   * ────────────────────────────────────────────────── */
  const overlay    = document.getElementById("date-overlay");
  const dateInput  = document.getElementById("date-input");
  const editBtn    = document.getElementById("edit-date-btn");
  const cancelBtn  = document.getElementById("cancel-btn");
  const confirmBtn = document.getElementById("confirm-btn");

  /** Date → "YYYY-MM-DDTHH:MM" en heure LOCALE (toISOString donne de l'UTC : on compense). */
  function toLocalInputValue(date) {
    const offset = date.getTimezoneOffset() * 60000;
    return new Date(date - offset).toISOString().slice(0, 16);
  }

  editBtn.addEventListener("click", () => {
    dateInput.value = toLocalInputValue(eventDate);
    overlay.classList.add("open");
  });
  cancelBtn.addEventListener("click", () => overlay.classList.remove("open"));
  overlay.addEventListener("click", (e) => { if (e.target === overlay) overlay.classList.remove("open"); });

  confirmBtn.addEventListener("click", async () => {
    const val = dateInput.value;
    if (!val) return;
    const newDate = new Date(val);
    if (isNaN(newDate.getTime())) return;

    /*
     * On stocke en ISO 8601 UTC via toISOString().
     * Garantit une représentation non ambiguë, indépendante du fuseau.
     * Les deux appareils recalculeront `diff` par rapport à new Date() local,
     * ce qui est correct tant qu'ils sont dans le même fuseau.
     */
    await setDoc(configDoc, { iso: newDate.toISOString() });
    overlay.classList.remove("open");
  });

  /* ──────────────────────────────────────────────────
   * BADGE "DEPUIS N JOURS"
   * ────────────────────────────────────────────────── */
  const startDate = new Date(2025, 7, 12); // mois 0-indexé : 7 = août

  function updateSince() {
    const days = Math.floor((Date.now() - startDate) / 86400000);
    document.getElementById("since").innerText = `${days} jours 💕`;
  }
  updateSince();
  setInterval(updateSince, 60000);
</script>

</body>
</html>
